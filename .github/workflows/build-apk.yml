
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o HizliTeklif_GitHub_APK.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name gradlew -type f | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HizliTeklif-APK
          path: project/**/build/outputs/apk/**/*.apk
